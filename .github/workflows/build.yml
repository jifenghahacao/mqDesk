name: Build MQDesk Packages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      upload_to_apk:
        description: '是否将构建产物提交到 apk/ 目录（需要 write 权限）'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '22'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Windows installer
        run: npm run tauri:build:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: mqdesk-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Copy to apk/
        if: ${{ inputs.upload_to_apk }}
        run: |
          New-Item -ItemType Directory -Force -Path apk
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe apk/

      - name: Commit apk/ artifacts
        if: ${{ inputs.upload_to_apk && github.ref == 'refs/heads/main' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: upload Windows installer artifacts'
          file_pattern: 'apk/*.exe'

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build Tauri Linux .deb
        run: cargo tauri build --target x86_64-unknown-linux-gnu

      - name: Upload Linux .deb
        uses: actions/upload-artifact@v4
        with:
          name: mqdesk-linux-deb
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

      - name: Copy to apk/
        if: ${{ inputs.upload_to_apk }}
        run: |
          mkdir -p apk
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb apk/

      - name: Commit apk/ artifacts
        if: ${{ inputs.upload_to_apk && github.ref == 'refs/heads/main' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: upload Linux deb artifacts'
          file_pattern: 'apk/*.deb'
