[package]
name = "mqdesk-core"
version = "0.1.0"
edition = "2021"
description = "MQDesk 核心逻辑：RabbitMQ 客户端 + 健康度 + 存储（不依赖 Tauri）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
lapin = "2.5"
sled = "0.34"
ring = "0.17"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
parking_lot = "0.12"
base64 = "0.22"
async-trait = "0.1"
regex = "1"
futures-util = "0.3"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1"
tempfile = "3"
